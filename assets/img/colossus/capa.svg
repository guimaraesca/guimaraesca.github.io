<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1120" width="800" height="1120">
  <!--
    Capa Colossus · v1.3.0
    Layout limpo, sem sobreposições, com o logo oficial (C de fita
    perfurada + válvula) substituindo o chip genérico.
    Sem QR code — o README/Release do GitHub cumpre o papel de acesso.
  -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="60%" stop-color="#122240"/>
      <stop offset="100%" stop-color="#1a3058"/>
    </linearGradient>
    <linearGradient id="tapeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#29a8e8"/>
    </linearGradient>
    <radialGradient id="valveGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"  stop-color="#fff2c2"/>
      <stop offset="25%" stop-color="#ffcc66" stop-opacity="0.98"/>
      <stop offset="55%" stop-color="#ff8c42" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="800" height="1120" fill="url(#bgGrad)"/>

  <!-- Grade sutil de circuito -->
  <g stroke="#1e3a5f" stroke-width="0.5" opacity="0.35">
    <line x1="100" y1="0" x2="100" y2="1120"/>
    <line x1="200" y1="0" x2="200" y2="1120"/>
    <line x1="300" y1="0" x2="300" y2="1120"/>
    <line x1="400" y1="0" x2="400" y2="1120"/>
    <line x1="500" y1="0" x2="500" y2="1120"/>
    <line x1="600" y1="0" x2="600" y2="1120"/>
    <line x1="700" y1="0" x2="700" y2="1120"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="500" y2="500"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="700" x2="800" y2="700"/>
    <line x1="0" y1="800" x2="800" y2="800"/>
    <line x1="0" y1="900" x2="800" y2="900"/>
    <line x1="0" y1="1000" x2="800" y2="1000"/>
  </g>

  <!-- Trilhas de circuito decorativas -->
  <g stroke="#4fc3f7" stroke-width="2" fill="none" opacity="0.28" filter="url(#glow)">
    <path d="M 100 0 L 100 180 L 200 180 L 200 280 L 150 280 L 150 400"/>
    <circle cx="100" cy="180" r="4" fill="#4fc3f7"/>
    <circle cx="200" cy="280" r="4" fill="#4fc3f7"/>
    <circle cx="150" cy="400" r="4" fill="#4fc3f7"/>
    <path d="M 700 0 L 700 150 L 600 150 L 600 320 L 650 320 L 650 400"/>
    <circle cx="700" cy="150" r="4" fill="#4fc3f7"/>
    <circle cx="600" cy="320" r="4" fill="#4fc3f7"/>
    <circle cx="650" cy="400" r="4" fill="#4fc3f7"/>
    <path d="M 0 800 L 120 800 L 120 880"/>
    <circle cx="120" cy="800" r="4" fill="#4fc3f7"/>
    <path d="M 800 850 L 680 850 L 680 920"/>
    <circle cx="680" cy="850" r="4" fill="#4fc3f7"/>
  </g>

  <!-- Nós luminosos espalhados -->
  <g fill="#4fc3f7" opacity="0.14">
    <circle cx="300" cy="150" r="60"/>
    <circle cx="500" cy="200" r="40"/>
    <circle cx="150" cy="620" r="40"/>
    <circle cx="650" cy="650" r="45"/>
  </g>

  <!-- ============ LOGO CENTRAL ============ -->
  <!-- C como fita de papel perfurada + válvula central (marca oficial) -->
  <g transform="translate(400, 420)">
    <!-- Anel externo sutil -->
    <circle cx="0" cy="0" r="200" fill="none" stroke="#4fc3f7" stroke-width="1" opacity="0.4"/>
    <circle cx="0" cy="0" r="192" fill="none" stroke="#4fc3f7" stroke-width="0.4" opacity="0.25"/>

    <!-- C de fita de papel -->
    <g filter="url(#softGlow)">
      <path d="
        M 120 -144
        A 170 170 0 1 0 120 144
        L 120 94
        A 120 120 0 1 1 120 -94
        Z"
        fill="url(#tapeGrad)" stroke="#81d4fa" stroke-width="1.5"/>
    </g>

    <!-- Bordas de corte da fita -->
    <g stroke="#e0f0ff" stroke-width="1.5" opacity="0.75">
      <line x1="120" y1="-144" x2="120" y2="-94"/>
      <line x1="120" y1="94" x2="120" y2="144"/>
    </g>

    <!-- Perfurações externas (fileira 1) -->
    <g fill="#0a1628">
      <circle cx="0"   cy="-150" r="6"/>
      <circle cx="-77" cy="-132" r="6"/>
      <circle cx="-134" cy="-81" r="6"/>
      <circle cx="-160" cy="-13" r="6"/>
      <circle cx="-154" cy="58" r="6"/>
      <circle cx="-114" cy="118" r="6"/>
      <circle cx="-51" cy="154" r="6"/>
      <circle cx="19"  cy="152" r="6"/>
      <circle cx="82"  cy="124" r="6"/>
    </g>
    <!-- Perfurações internas (fileira 2) -->
    <g fill="#0a1628">
      <circle cx="0"   cy="-132" r="4"/>
      <circle cx="-64" cy="-114" r="4"/>
      <circle cx="-109" cy="-68" r="4"/>
      <circle cx="-130" cy="-9" r="4"/>
      <circle cx="-122" cy="52" r="4"/>
      <circle cx="-88" cy="102" r="4"/>
      <circle cx="-35" cy="130" r="4"/>
      <circle cx="26"  cy="130" r="4"/>
      <circle cx="78"  cy="106" r="4"/>
    </g>

    <!-- Válvula central (coração luminoso) -->
    <g>
      <circle cx="0" cy="0" r="70" fill="url(#valveGlow)"/>
      <ellipse cx="0" cy="0" rx="20" ry="34" fill="#ffcc66" opacity="0.95"/>
      <ellipse cx="0" cy="0" rx="13" ry="27" fill="#fff2c2" opacity="0.85"/>
      <path d="M -8 -12 L 0 7 L 8 -12" fill="none" stroke="#ff6b35" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="-6" r="2.5" fill="#ffffff"/>
    </g>
  </g>

  <!-- ============ TÍTULO ============ -->
  <text x="400" y="680" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="72" font-weight="bold" fill="#e0f0ff" letter-spacing="12" filter="url(#glow)">COLOSSUS</text>
  <text x="400" y="708" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="11" fill="#81d4fa" letter-spacing="4" opacity="0.85">em homenagem ao computador de Bletchley Park · 1943</text>

  <!-- Linha decorativa -->
  <line x1="240" y1="730" x2="560" y2="730" stroke="#4fc3f7" stroke-width="1" opacity="0.5"/>

  <!-- ============ SUBTÍTULO ============ -->
  <text x="400" y="762" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="18" fill="#90caf9" letter-spacing="3">MEMORIAL PEDAGÓGICO SOBRE</text>
  <text x="400" y="790" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="18" fill="#90caf9" letter-spacing="3">PENSAMENTO COMPUTACIONAL</text>
  <text x="400" y="818" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="18" fill="#90caf9" letter-spacing="3">NA EDUCAÇÃO BÁSICA</text>

  <!-- Selo de Volume -->
  <g transform="translate(400, 852)">
    <rect x="-82" y="-14" width="164" height="26" rx="13" fill="none" stroke="#4fc3f7" stroke-width="1" opacity="0.7"/>
    <text x="0" y="4" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="12" fill="#4fc3f7" letter-spacing="4" font-weight="bold">VOLUME 1 · FUNDAMENTOS</text>
  </g>

  <!-- ============ ÍCONES DAS ETAPAS ============ -->
  <!-- Ícones desenhados em SVG puro para render confiável em qualquer engine -->
  <g transform="translate(400, 905)" opacity="0.9">
    <!-- 1. Anos iniciais · ABC (bloco infantil) -->
    <g transform="translate(-195, 0)">
      <circle cx="0" cy="0" r="26" fill="none" stroke="#ffcc80" stroke-width="1.5"/>
      <text x="0" y="6" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#ffcc80">ABC</text>
      <text x="0" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ffcc80" letter-spacing="1">1º–5º EF</text>
    </g>
    <line x1="-163" y1="0" x2="-93" y2="0" stroke="#546e7a" stroke-width="1" opacity="0.6"/>
    <!-- 2. Anos finais · </> (código) -->
    <g transform="translate(-65, 0)">
      <circle cx="0" cy="0" r="26" fill="none" stroke="#a5d6a7" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#a5d6a7">&lt;/&gt;</text>
      <text x="0" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#a5d6a7" letter-spacing="1">6º–9º EF</text>
    </g>
    <line x1="-33" y1="0" x2="37" y2="0" stroke="#546e7a" stroke-width="1" opacity="0.6"/>
    <!-- 3. Ensino Médio · Σ (sigma — síntese/matemática) -->
    <g transform="translate(65, 0)">
      <circle cx="0" cy="0" r="26" fill="none" stroke="#ce93d8" stroke-width="1.5"/>
      <text x="0" y="7" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#ce93d8">Σ</text>
      <text x="0" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ce93d8" letter-spacing="1">1ª–3ª EM</text>
    </g>
    <line x1="97" y1="0" x2="167" y2="0" stroke="#546e7a" stroke-width="1" opacity="0.6"/>
    <!-- 4. Projetos · triângulo "play" -->
    <g transform="translate(195, 0)">
      <circle cx="0" cy="0" r="26" fill="none" stroke="#ef9a9a" stroke-width="1.5"/>
      <polygon points="-7,-10 -7,10 10,0" fill="#ef9a9a"/>
      <text x="0" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ef9a9a" letter-spacing="1">Projetos</text>
    </g>
  </g>

  <!-- ============ AUTOR ============ -->
  <text x="400" y="1010" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="22" fill="#e0f0ff" font-weight="bold">Carlos Artur Guimarães</text>
  <text x="400" y="1032" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="10" fill="#90caf9" letter-spacing="1">CENEP-RN · IMD/UFRN · GameLab · Desafio GamEdu</text>

  <!-- Linha separadora sutil -->
  <line x1="200" y1="1058" x2="600" y2="1058" stroke="#4fc3f7" stroke-width="0.6" opacity="0.35"/>

  <!-- ============ RODAPÉ ============ -->
  <text x="400" y="1080" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="10" fill="#78909c" letter-spacing="1.5">1ª EDIÇÃO · VOLUME 1 · 2026 · CC BY-SA 4.0</text>
  <text x="400" y="1100" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="9" fill="#546e7a" letter-spacing="1">github.com/tucaguimaraes/colossus-livro</text>
</svg>
